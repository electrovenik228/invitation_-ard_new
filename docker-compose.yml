name: invitation

services:
  web:
    build: .
    image: invitation-kyz-uzatuu:latest
    container_name: invitation-kyz-uzatuu
    ports:
      - "6767:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
